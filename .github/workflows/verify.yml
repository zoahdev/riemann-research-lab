name: Verify local results
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-rh.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/check_triple_profile.py --samples 10000
      - run: python experiments/weil_kernel.py --max-node 6 --intervals 64 --dps 100
      - run: python experiments/check_semigroup_obstruction.py
      - run: python experiments/modulated_weil.py --length 12 --samples 32
      - run: python experiments/weil_cells.py --samples 8
      - run: python experiments/weil_cells.py --cells 96 --samples 8
